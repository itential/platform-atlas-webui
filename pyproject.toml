[project]
name = "platform-atlas-webui"
version = "1.1.1"
description = "Optional WebUI for Platform Atlas — ships as a separate wheel for customers who allow server components"
license = "GPL-3.0-or-later"
authors = [{ name = "Cody Rester", email = "cody.rester@itential.com" }]
maintainers = [{ name = "Cody Rester", email = "cody.rester@itential.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "platform-atlas (>=1.7,<2.0)",
  "fastapi (>=0.136,<1.0)",
  "uvicorn[standard] (>=0.32,<1.0)",
  "jinja2 (>=3.1,<4.0)",
  "python-multipart (>=0.0.20,<1.0)",
  "starlette (>=1.2,<2.0)",
  "cryptography (>=42.0,<50.0)",
]

[project.scripts]
platform-atlas-webui = "platform_atlas_webui.main:main"

[tool.poetry]
packages = [{include = "platform_atlas_webui", from = "src"}]

[tool.poetry.group.dev.dependencies]
# Local-dev override: install the sibling platform-atlas project from path so
# changes to the core package are picked up without rebuilding/reinstalling.
# At wheel-build time, the version constraint in [project.dependencies] is what
# end users actually resolve against.
platform-atlas = { path = "../platform-atlas", develop = true }

[tool.bandit]
skips = ["B105", "B106"]

[tool.pylint.master]
ignore-patterns = ["__pycache__"]

[tool.pylint."messages control"]
disable = [
    "C0301", # line-too-long
    "C0415", # import-outside-toplevel
    "W0718", # broad-exception-caught
    "W0603", # global statement
    "R0914", # too-many-locals
    "R0912", # too-many-branches
    "R0913", # too-many-arguments
    "R0902", # too-many-instance-attributes
    "R0915", # too-many-statements
    "R0911", # too-many-return-statements
    "R1702", # too-many-nested-blocks
    "R0801", # duplicate-code
    "R1705", # no-else-return
]

[tool.pylint.format]
max-line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
